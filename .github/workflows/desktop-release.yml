# Multi-OS desktop release for webgen-motion.
#
# Produces installers (.dmg / .msi / .AppImage / .deb) on every push of
# a `v*` tag, attached to a draft GitHub release named after the tag.
# Each matrix job runs on its native runner so the Tauri sidecar
# binaries (Node + ffmpeg) match the host triple automatically.
#
# Trigger manually via the Actions tab too (`workflow_dispatch`) for
# preview builds without tagging.
#
# === GitHub Secrets requis (Settings → Secrets and variables → Actions) ===
#   APPLE_SIGNING_IDENTITY    "Developer ID Application: Ben NDUI (A24549KKK4)"
#   APPLE_CERTIFICATE         base64 du .p12 cert exporté du Keychain
#   APPLE_CERTIFICATE_PASSWORD password du .p12
#   APPLE_ID                  ben.ndui@icloud.com
#   APPLE_PASSWORD            app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID             A24549KKK4
# Sans ces secrets, le job macOS produit un .dmg non-signé inutilisable.
# Windows / Linux ignorent ces vars.

name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          # Intel macOS : cross-compilé sur le runner Apple Silicon
          # (macos-14). Les runners Intel `macos-13` sont raréfiés par
          # GitHub → le job restait 24h "awaiting a runner" puis timeout.
          # Le SDK macOS de macos-14 build x86_64 sans souci ; les
          # sidecars x86_64 viennent du fetch `--all` ci-dessous.
          - os: macos-14
            triple: x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            rust-target: x86_64-pc-windows-msvc
          # Linux : .deb seulement. L'AppImage casse en CI — Tauri
          # télécharge son propre linuxdeploy qui ne respecte pas
          # APPIMAGE_EXTRACT_AND_RUN → hang FUSE ~1h47 puis "failed to
          # run linuxdeploy". Le .deb se bundle parfaitement et couvre
          # Debian/Ubuntu. AppImage = follow-up.
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            rust-target: x86_64-unknown-linux-gnu
            extra-args: "--bundles deb"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Linux WebKit & build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libfuse2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.triple }}

      - name: npm ci
        run: npm ci

      # Linux runner ships sans linuxdeploy → tauri-cli ne peut pas
      # produire les .AppImage / .deb. Install l'AppImage officielle,
      # met dans PATH. (Setup typique GH Actions pour Tauri Linux.)
      - name: Install linuxdeploy (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -fL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          sudo mv linuxdeploy.AppImage /usr/local/bin/linuxdeploy

      # macOS uniquement : import .p12 cert dans un keychain temporaire.
      # Sans ça, `desktop-prepare-standalone.mjs` qui tourne en
      # `beforeBuildCommand` ne trouve pas la signing identity et
      # tous les nested codesign échouent avec "specified item could
      # not be found in the keychain". tauri-action plus tard ne
      # signe que le top-level .app/.dmg, pas les binaries nested.
      - name: Import Apple certificate to keychain (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          KCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KCHAIN_PW" \
            build.keychain
          rm /tmp/cert.p12
          echo "—— Identités codesigning visibles dans le keychain :"
          security find-identity -v -p codesigning build.keychain

      # `--all` fetch les sidecars des 4 triples. Indispensable pour la
      # leg Intel cross-compilée sur le runner arm (sinon elle bundlerait
      # des binaires arm64 dans une app x86_64). Coût négligeable sur les
      # autres legs (quelques tarballs Node/ffmpeg).
      - name: Fetch sidecar binaries (Node + ffmpeg)
        run: node scripts/desktop-fetch-binaries.mjs --all

      # Extrait la section CHANGELOG correspondante au tag (ex. v0.2.0
      # → cherche `## [0.2.0]` jusqu'au prochain `## [`). Vide si pas
      # trouvé — dans ce cas tauri-action utilise un body default.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/{
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
            }
            found
          ' CHANGELOG.md)
          {
            echo "notes<<RELNOTES_EOF"
            echo "$NOTES"
            echo "RELNOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux : les runners CI n'ont pas de FUSE → linuxdeploy (lui
          # même une AppImage) plantait avec "failed to run linuxdeploy".
          # EXTRACT_AND_RUN fait extraire les AppImages au lieu de monter
          # FUSE ; NO_STRIP évite l'échec strip sur les sidecars bundlés.
          # Ignorés par les builds macOS / Windows.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
          # macOS signing + notarization. Skipped silencieusement sur
          # Windows / Linux qui n'utilisent pas ces vars.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "webgen-motion ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }} ${{ matrix.extra-args }}

      # macOS uniquement : notarize + staple le .dmg que tauri-action
      # vient de produire. tauri-action v0 lance déjà notarytool si
      # APPLE_ID / PASSWORD / TEAM_ID sont set ET signs si APPLE_*
      # certificate vars sont là — mais comme on a un nested codesign
      # complexe géré par desktop-prepare-standalone.mjs (étape
      # beforeBuildCommand), la submission peut ne pas se déclencher
      # automatiquement. Ce step force la pipeline complète via
      # notre helper script local-equivalent.
      - name: Notarize + staple (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Pas de .env.local en CI — set les vars directement
          export APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY
          # --skip-build : tauri-action a déjà build, on saute juste
          # le rebuild et on attaque submit + staple direct.
          node scripts/notarize-and-staple.mjs --skip-build

  # Notif Discord après tous les builds (succès OU échec). Poste le statut
  # global + le lien vers la release draft (installeurs attachés) + les logs
  # CI. Webhook stocké en secret DISCORD_RELEASE_WEBHOOK (jamais en dur).
  notify-discord:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK absent — notif ignorée."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            COLOR=3066993
            TITLE="✅ GEN MOTION $REF — build réussi"
            DESC="Les installeurs (.dmg macOS · .msi Windows · .deb Linux) sont attachés à la **release draft**. Publie-la depuis l'onglet Releases pour la rendre téléchargeable."
          else
            COLOR=15158332
            TITLE="❌ GEN MOTION $REF — build $RESULT"
            DESC="Le build de release a échoué. Ouvre les logs CI pour la cause."
          fi
          RELEASES_URL="https://github.com/$REPO/releases"
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          PAYLOAD=$(jq -n \
            --arg t "$TITLE" --arg d "$DESC" --argjson c "$COLOR" \
            --arg rel "$RELEASES_URL" --arg run "$RUN_URL" \
            '{username:"GEN MOTION Release", embeds:[{title:$t, description:$d, color:$c, fields:[{name:"📦 Release (draft)", value:$rel}, {name:"🔧 Logs CI", value:$run}]}]}')
          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
