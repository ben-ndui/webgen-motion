# Multi-OS desktop release for webgen-motion.
#
# Produces installers (.dmg / .msi / .AppImage / .deb) on every push of
# a `v*` tag, attached to a draft GitHub release named after the tag.
# Each matrix job runs on its native runner so the Tauri sidecar
# binaries (Node + ffmpeg) match the host triple automatically.
#
# Trigger manually via the Actions tab too (`workflow_dispatch`) for
# preview builds without tagging.
#
# === GitHub Secrets requis (Settings → Secrets and variables → Actions) ===
#   APPLE_SIGNING_IDENTITY    "Developer ID Application: Ben NDUI (A24549KKK4)"
#   APPLE_CERTIFICATE         base64 du .p12 cert exporté du Keychain
#   APPLE_CERTIFICATE_PASSWORD password du .p12
#   APPLE_ID                  ben.ndui@icloud.com
#   APPLE_PASSWORD            app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID             A24549KKK4
# Sans ces secrets, le job macOS produit un .dmg non-signé inutilisable.
# Windows / Linux ignorent ces vars.

name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            rust-target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            rust-target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux WebKit & build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.triple }}

      - name: npm ci
        run: npm ci

      - name: Fetch sidecar binaries (Node + ffmpeg)
        run: node scripts/desktop-fetch-binaries.mjs

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Skipped silencieusement sur
          # Windows / Linux qui n'utilisent pas ces vars.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "webgen-motion ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }}

      # macOS uniquement : notarize + staple le .dmg que tauri-action
      # vient de produire. tauri-action v0 lance déjà notarytool si
      # APPLE_ID / PASSWORD / TEAM_ID sont set ET signs si APPLE_*
      # certificate vars sont là — mais comme on a un nested codesign
      # complexe géré par desktop-prepare-standalone.mjs (étape
      # beforeBuildCommand), la submission peut ne pas se déclencher
      # automatiquement. Ce step force la pipeline complète via
      # notre helper script local-equivalent.
      - name: Notarize + staple (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Pas de .env.local en CI — set les vars directement
          export APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY
          # --skip-build : tauri-action a déjà build, on saute juste
          # le rebuild et on attaque submit + staple direct.
          node scripts/notarize-and-staple.mjs --skip-build
