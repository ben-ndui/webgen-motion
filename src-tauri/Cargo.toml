[package]
name = "webgen-motion"
version = "0.2.3"
description = "Motion Studio local-first — capture, mix and compose motion design clips on your own machine."
authors = ["Ben Ndui — Smooth & Design"]
license = "MIT"
repository = "https://github.com/ben-ndui/webgen-motion"
edition = "2021"
rust-version = "1.77"

[lib]
name = "webgen_motion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
